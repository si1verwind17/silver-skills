spring:
  application:
    name: booking-service
  # Spring MVC on virtual threads rather than WebFlux — every call here is a
  # blocking JDBC round trip to a plpgsql function, and R3/NF4 correctness
  # depends on the JDBC SQLSTATE path (stack-selection.md section 6).
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${BOOKING_DB_URL}
    username: ${BOOKING_DB_USER}
    password: ${BOOKING_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${BOOKING_DB_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # No default.  A deployment without an issuer fails at startup rather
          # than accepting unverified tokens (R17).
          issuer-uri: ${BOOKING_OIDC_ISSUER}

  kafka:
    bootstrap-servers: ${BOOKING_KAFKA_BOOTSTRAP:}
    producer:
      acks: all
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${BOOKING_KAFKA_GROUP:booking-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

booking:
  kafka:
    lifecycle-topic: ${BOOKING_LIFECYCLE_TOPIC:booking-lifecycle-v1}
    gate-resolution-topic: ${BOOKING_GATE_TOPIC:booking-gate-resolution-v1}
    group-id: ${BOOKING_KAFKA_GROUP:booking-service}
    send-timeout-seconds: 10
  relay:
    # Dispatch lag is an SLO (NF11) and the scan is cheap, so the interval is
    # short.  Batch size bounds how long one pass can hold the broker.
    interval-ms: 500
    batch-size: 100
  sweep:
    expiry-interval-ms: 30000
    completion-interval-ms: 3600000
    batch-size: 500

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    dev.booking: INFO
  pattern:
    # NF7: the correlation id belongs on every line, not only where remembered.
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
